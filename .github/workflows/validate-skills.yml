name: validate-skills
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: pip install pyyaml
      - run: python3 build_skills.py
      - run: python3 skills/consolidate-comments/scripts/consolidate_comments.py self-test
      - run: python3 skills/consolidate-specs/scripts/consolidate_specs.py self-test
      # weasyprint binds to GTK through cffi, so the native libraries come first.
      # It is here to give the PDF branch its only end-to-end coverage: no
      # LibreOffice and no weasyprint on the maintainer's Windows machine, where
      # the GTK libraries are not pip-installable at all.
      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - run: pip install requests beautifulsoup4 lxml python-docx weasyprint
      - run: python3 skills/web-site-to-document/scripts/test_scrape.py
